services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ttcf
      POSTGRES_PASSWORD: ttcf
      POSTGRES_DB: ttcf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttcf -d ttcf"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5433:5432"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://ttcf:ttcf@db:5432/ttcf
      STORAGE_DIR: /app/storage
      ASSETS_DIR: /app/assets
      CONFIGS_DIR: /app/configs
    volumes:
      - ./assets:/app/assets
      - ./storage:/app/storage
      - ./configs:/app/configs
      - ./backend/app:/app/backend/app
      - ./backend/tests:/app/backend/tests
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
