name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: fake
      VOICE_PROVIDER: fake
      LAB_PLANNER: fake
      LAB_IMAGE_PROVIDER: fake
      LAB_VIDEO_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - name: System deps (ffmpeg with libass, fontconfig)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg fontconfig fonts-dejavu-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install
        run: |
          pip install -q -r requirements.lock.txt
          pip install -q -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Tests (fake providers, no keys)
        run: pytest -q -p no:warnings

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Build
        run: npm run build
