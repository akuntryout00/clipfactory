[project]
name = "clipfactory"
version = "0.2.0"
description = "ClipFactory — topic + template -> short-form vertical MP4 (TikTok/Reels/Shorts) from your own B-roll, plus an AI Lab for fully generated clips"
license = { text = "Elastic-2.0" }
authors = [{ name = "Feyzili Mikayil" }]
maintainers = [{ name = "Feyzili Mikayil (@feyzili)" }]
keywords = ["video", "tiktok", "shorts", "reels", "ffmpeg", "ai", "elevenlabs", "openai"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "openai>=1.50,<3",
    "elevenlabs>=1.10,<3",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    "google-genai>=1.0,<3",
    "fal-client>=0.5,<2",
    "pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
clipfactory = "app.cli:app"
ttcf = "app.cli:app"  # legacy alias

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B904", "B905", "SIM102", "SIM108", "UP007", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E731", "SIM117", "E702", "E741"]
