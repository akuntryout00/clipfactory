[project]
name = "tiktok-content-factory"
version = "0.1.0"
description = "TikTok Content Factory MVP — topic + template -> TikTok-ready MP4 from own B-roll"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "openai>=1.50,<3",
    "elevenlabs>=1.10,<3",
    "typer>=0.12,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23"]

[project.scripts]
ttcf = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
